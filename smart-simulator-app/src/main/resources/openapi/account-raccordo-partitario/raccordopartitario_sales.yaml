components:
  schemas:

    # Product information schema
    SrvActnData:
      type: object
      description: Service account action information.
      properties:
        bankCod:
          $ref: 'components-v1.2.2.yaml#/components/schemas/BankCod'
        officeCod:
          $ref: 'components-v1.2.2.yaml#/components/schemas/OfficeCod'
        srvCod:
          type: string
          description: PLAB technical service code.
        key:
          type: string
          description: Key that identifies the preregistration account service or the account service under change process.
        externalKey:
          type: string
          description: Account service key on the legacy application. Can be null during preactivation phase (selling or change offer that requires new account service) but must be set before final activation. Always set for change/close processes on pre-existing account service.
        legacyId:
          type: string
          description: Internal legacy ID. Set if the legacy application has an internal immutable ID for each account service.
        tsStart:
          $ref: 'components-v1.2.2.yaml#/components/schemas/DateTimeType'
        tsEnd:
          $ref: 'components-v1.2.2.yaml#/components/schemas/DateTimeType'
        settlementSrvActn:
          $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntExtKey'
        statusInfo:
          $ref: '#/components/schemas/StatusInfoRP'
        ndgInfo:
          $ref: 'components-v1.2.2.yaml#/components/schemas/NdgInfo'
        prodInfo:
          $ref: 'components-v1.2.2.yaml#/components/schemas/ProdInfo'
        srvActnInfo:
          type: object
          description: Specific information for the settlement account (theoretically optional, but each account is defined in this entity).

    StatusInfoRP:
      type: object
      description: Status information.
      properties:
        tsStatus:
          $ref: 'components-v1.2.2.yaml#/components/schemas/DateTimeType'
        status:
          enum: [CREATED, CONFIGURED, RESERVED, ACTIVE, CANCELED]
          description: Status code.
        sStatus:
          type: string
          description: Sub status code.

    CanBeCreatedRequest:
      type: object
      description: Request for checking if a service account can be created.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          required:
            - srvActnPreDatas
          properties:
            additionalUserData:
              type: object
              description: >
                Additional user data for checks. Known properties include:
                - ivaasEnable: user has IVAAS enabled (true/false)
            settlementSrvActn:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntExtKey'
            srvActnPreDatas:
              type: array
              description: List of service account data for pre-creation checks.
              items:
                $ref: '#/components/schemas/SimpleProduct'

    SimpleProduct:
      type: object
      description: Service account data for pre-creation checks.
      required:
        - bankCod
        - srvCod
        - officeCod
        - ndgInfo
        - externalProdInfo
      properties:
        bankCod:
          $ref: 'components-v1.2.2.yaml#/components/schemas/BankCod'
        srvCod:
          type: string
          description: Service code for the service account.
          example: "CC"
        officeCod:
          $ref: 'components-v1.2.2.yaml#/components/schemas/OfficeCod'
        ndgInfo:
          allOf:
            - $ref: 'components-v1.2.2.yaml#/components/schemas/NdgInfo'
            - type: object
              description: Additional NDG information for the service account.
              properties:
                ndgNature:
                  type: string
                  description: Nature of the NDG.
                  enum:
                    - NATURAL_PERSON
                    - JURIDICAL_PERSON
                    - JOINT_OWNERSHIP
                  example: "NATURAL_PERSON"
          example:
            cntrNdgKey: "12345678901"
            cntrNdgType: "REAL"
            ndgNature: "NATURAL_PERSON"
        externalProdInfo:
          type: object
          description: External product information for the service account.
          required:
            - prodExtKey
          properties:
            prodExtKey:
              type: string
              description: External product key.
              example: "D001"
            prodAttrs:
              type: array
              description: List of product attributes from CPQ catalog.
              items:
                type: object
                required:
                  - attrCod
                  - attrVal
                properties:
                  attrCod:
                    type: string
                    description: Code of the product attribute CPQ layers have '#' character as joiner -> "TEMPLATE#GRUPPO#SOTTOGRUPO#ATTRIBUTO#DATO".
                    example: "002#SIMV#ALLOC#33#21"
                  attrVal:
                    type: string
                    description: Value of the product attribute.
                    example: "Value1"

    CanBeCreatedResponse:
      type: object
      description: Response for the create service account request.
      properties:
        results:
          type: array
          description: List of results for each service account data checked.
          items:
            type: object
            required:
              - srvActnPreData
              - canBeCreated
            properties:
              srvActnPreData:
                $ref: '#/components/schemas/SimpleProduct'
              canBeCreated:
                type: boolean
                description: Indicates if the service account can be created.
              motivationCode:
                type: string
                description: Motivation code for the result.
                example: "NC_001"
              motivationDescription:
                type: string
                description: Motivation description for the result.
                example: "The service account cannot be created due to missing information."
              additionalInfo:
                type: array
                description: List of additional information should be given.
                items:
                  $ref: 'components-v1.2.2.yaml#/components/schemas/AdditionalAttribute'

    CreateDtoRequest:
      type: object
      description: Request for creating a new service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvActnData:
              $ref: '#/components/schemas/SrvActnData'

    CreateDtoResponse:
      type: object
      description: Response for the create service account request.
      properties:
        srvAcntKey:
          $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
        statusInfo:
          $ref: '#/components/schemas/StatusInfoRP'

    ReserveDtoRequest:
      type: object
      description: Request for reserving a service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

    ReserveDtoResponse:
      type: object
      description: Response for the reserve service account request.
      properties:
        srvAcntExtKey:
          $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntExtKey'

    ActivateDtoRequest:
      type: object
      description: Request for activating a service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

    ActivateDtoResponse:
      type: object
      description: Response for activating a service account.
      properties:
        newAncillaryData:
          type: array
          description: List of new ancillary data created during activation.
          items:
            $ref: 'components-v1.2.2.yaml#/components/schemas/AdditionalAttribute'

    GetMainInfoDtoRequest:
      type: object
      description: Request for retrieving main information of the service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

    GetMainInfoDtoResponse:
      type: object
      description: Response for retrieving main information of the service account.
      properties:
        srvActnData:
          $ref: '#/components/schemas/SrvActnData'

    GetExternalKeyDtoRequest:
      type: object
      description: Request for retrieving the external key of the service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey
    
    GetExternalKeyDtoResponse:
      type: object
      properties: 
        srvAcntExtKey:
          $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntExtKey'

    SetSettlementServiceAccountKeyDtoRequest:
      type: object
      description: Request for setting the settlement service account key.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
            settlementAccountSrv:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntExtKey'
          required:
          - caseID
          - srvAcntKey
          - settlementAccountSrv
          
    GetOthSrvActnsDtoRequest:
      type: object
      description: Request for retrieving associated account services.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

    GetOthSrvActnsDtoResponse:
      type: object
      description: Response for retrieving associated account services.
      properties: 
        srvActnData:
          type: array
          items:
            $ref: '#/components/schemas/SrvActnData'

    GetAdditionalAttributesDtoRequest:
      type: object
      description: Request for retrieving additional attributes for the service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

    GetAdditionalAttributesDtoResponse:
      type: object
      description: Generic list of additional attributes as key-value pairs.
      properties:
        accountAdditionalAttributes:
          $ref: '#/components/schemas/AdditionalAttributes'
        contractAdditionalAttributes:
          $ref: '#/components/schemas/AdditionalAttributes'

    AdditionalAttributes:
      type: object
      properties:
        qualifiers:
          type: array
          items:
            $ref: 'components-v1.2.2.yaml#/components/schemas/AdditionalAttribute'
        ancillaryData:
          type: array
          items:
            $ref: 'components-v1.2.2.yaml#/components/schemas/AdditionalAttribute'

    SetFinalNdgDtoRequest:
      type: object
      description: Request for setting the final NDG for the service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
            ndgInfo:
              $ref: 'components-v1.2.2.yaml#/components/schemas/NdgInfo'
          required:
          - caseID
          - srvAcntKey
          - ndgInfo

    CancelDtoRequest:
      type: object
      description: Request for canceling the service account.
      properties:
        header:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Header'
        payload:
          type: object
          properties:
            caseID:
              $ref: 'components-v1.2.2.yaml#/components/schemas/CaseID'
            srvAcntKey:
              $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
          required:
          - caseID
          - srvAcntKey

