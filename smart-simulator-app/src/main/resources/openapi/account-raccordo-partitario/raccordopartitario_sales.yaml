  version: 1.6.0
  x-change-log:
    - version: 1.5.0
      date: 2026-02-04
      changes:
        - Added field "entitySubType" to "ProdInfo" schema.
    - version: 1.6.0
      date: 2026-08-10
      changes:
        - Added endpoint "/smartengine/raccordo/can-be-created" and related schemas to check if a new service account can be created.
        - Refactor of schemas using the common components for better reusability and standard adoption.
  
tags:
- name: Sales
  description: Operations related to the Raccordo Partitario system.
