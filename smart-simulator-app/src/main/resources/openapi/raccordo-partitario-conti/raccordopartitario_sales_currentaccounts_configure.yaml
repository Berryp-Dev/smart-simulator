openapi: 3.0.3
info:
  title: Raccordo Partitario Configuration API
  description: API for the configuration of settlement reconciliation.
  version: 1.1.2
  
tags:
- name: Current-Account
  description: Operations related to current account management.

paths:
  /ui-app/raccordo/sales/current-accounts/configure:
    post:
      tags:
        - Current-Account
      summary: Executes the configuration of settlement reconciliation for a current account.
      description: Executes the configuration of settlement reconciliation for a current account.
      operationId: CurrentAccountConfigure
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentAccountsConfigureRequest'
        required: true
      responses:
        '204':
          description: No Content.
        '300':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error300'
        '301':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error301'
        '302':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error302'
        '303':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error303'
        '304':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error304'
        '400':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error400'
        '401':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error401'
        '403':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error403'
        '404':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error404'
        '405':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error405'
        '406':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error406'
        '409':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error409'
        '422':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error422'
        '429':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error429'
        '500':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error500'
        '501':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error501'
        '502':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error502'
        '503':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error503'
        '504':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error504'
        '505':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error505'
        '511':
          $ref: 'components-v1.2.2.yaml#/components/responses/Error511'
components:
  schemas:    
    CurrentAccountsConfigureRequest:
      required:
        - srvAcntKey
        - srvActnInfo
      type: object
      properties:
        srvAcntKey:
          $ref: 'components-v1.2.2.yaml#/components/schemas/SrvAcntKey'
        srvActnInfo:
          $ref: '#/components/schemas/CurrentAccountsSrvActnInfo'
    

    SrvActnInfo:
      type: object
      description: Internal object for all fields different from srvAcntKey.
      properties:
        branchCode:
          type: string
          description: Branch where the account is opened.
        operationalProduct:
          type: string
          description: Deprecated and optional because of present in creation. Operational product to be opened. Ignored in implementation
        commercialProduct:
          type: string
          description: Commercial product code to be opened. For ToMe, either fixed value 'A37094' or retrieved from catalog.
        currency:
          $ref: 'components-v1.2.2.yaml#/components/schemas/Currency'
        origination:
          type: string
          description: For ToMe, to be verified if fixed value or other with BSNS.
        natureAndScopeCod:
          type: string
          description: Nature and scope of the account; For ToMe, to be verified if fixed value or other with BSNS.
          # enum:
          #   - '01' # FAMILY SAVINGS
          #   - '02' # FAMILY FINANCING
          #   - '03' # FAMILY INVESTMENT
          #   - '04' # FAMILY VARIOUS SERVICES
        riskCode:
          type: string
          description: If missing, assigned by the ledger with default value.
        offer:
          type: string
          description: For ToMe, either fixed value 'OFFCCO99' or retrieved from catalog.
        agreement:
          type: string
          description: Agreement.
        linkedAccount:
          type: array
          description: Accounts linked to the one being opened.
          items:
            $ref: '#/components/schemas/RapportoCollegato'
        linkedNdg:
          type: string
          description: Only one occurrence for subscriber or company owner; attorneys/delegates are added in post-sale.
        linkedNdgRelationType:
          type: string
          description: Type of relationship. (18 for subscriber or 30 for company owner).
        accountExpiryDate:
          $ref: 'components-v1.2.2.yaml#/components/schemas/DateTimeType'
        anatocismo:
          type: string
          description: Compound interest flag.
        settlementFrequency:
          type: string
          description: Interest settlement frequency.
        settlementDate:
          $ref: 'components-v1.2.2.yaml#/components/schemas/DateTimeType'
        linkedCredit:
          type: string
          description: Linked credit.
        firstDepositAmount:
          type: number
          format: double
          description: First deposit amount.
        omitCheckbook:
          type: boolean
          description: disable Checkbook production. Default is false (Checkbook production enabled).
      required:
        - branchCode
        - commercialProduct
        - currency
        - natureAndScopeCod
        - offer

    RapportoCollegato:
      type: object
      description: Object for relationship between accounts.
      properties:
        relationshipCod:
          type: string
          description: Transparency/POS transaction/deposit account/fees and charges.
        officeCod:
          $ref: 'components-v1.2.2.yaml#/components/schemas/OfficeCod'
        accountKey:
          type: string
          description: Account key.


    CurrentAccountsSrvActnInfo:
      allOf:
        - $ref: '#/components/schemas/SrvActnInfo'
