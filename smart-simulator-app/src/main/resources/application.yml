# Unico application.yml del progetto (un solo boot). Contiene solo i valori
# identici in tutti gli ambienti. I valori che dipendono dall'ambiente (porta,
# datasource, connessione IBM MQ, bootstrap Kafka) stanno in
# application-<env>.yml, caricato con il profilo Spring attivo (dev, sit).
# Il profilo si attiva solo dall'esterno (SPRING_PROFILES_ACTIVE).
# I valori specifici di ciascun sottosistema stanno nel file dedicato del
# modulo, importato qui sotto via spring.config.import
# (es. paperless-config.yml per smart-simulator-paperless).

spring:
  application:
    name: smart-simulator-app

  config:
    import: classpath:paperless-config.yml

  # Il database non e' usato in questa versione: senza datasource l'avvio
  # fallirebbe perche' spring-boot-starter-jdbc e' nel core. Rimuovere questa
  # esclusione e reinserire spring.datasource.* negli application-<env>.yml
  # quando servira' la persistenza.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
